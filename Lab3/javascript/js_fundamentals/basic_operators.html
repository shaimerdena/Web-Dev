<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <script>
            let multip = 5 * 2;
            // 5 is operand
            // multiplication is binary operator
            let x = 5;
            let opp = -x;
            // negation is unary operator


            alert( '1' + 2 ); // "12"
            alert( 2 + '1' ); // "21"
            alert(2 + 2 + '1' ); // "41" and not "221"
            alert('1' + 2 + 2); // "122" and not "14"



            // No effect on numbers
            let z = 1;
            console.log( +z ); // 1

            let y = -2;
            console.log( +y ); // -2

            // Converts non-numbers
            console.log( +true ); // 1
            console.log( +"" );   // 0


            // Assignment returns value
            let a = 1;
            let b = 2;

            let c = 3 - (a = b + 1);

            console.log( a ); // 3
            console.log( c ); // 0


            // Chaining assignments
            let d, e, f;
            d = e = f = 2 + 2;


            // Increment/decrement
            let counter = 0;
            console.log( ++counter ); // 1

            let count = 0;
            console.log( count++ ); // 0



            // Bitwise operators
            //AND ( & )
            // OR ( | )
            // XOR ( ^ )
            // NOT ( ~ )
            // LEFT SHIFT ( << )
            // RIGHT SHIFT ( >> )
            // ZERO-FILL RIGHT SHIFT ( >>> )


            // Comma
            let l = (1 + 2, 3 + 4);

            console.log( l ); // 7 (the result of 3 + 4)
        </script>
    </body>
</html>
