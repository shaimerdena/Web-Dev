<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <script>
            "use strict";

            //shows "modal window"
            alert("Hello");

            // shows a modal window with a text message, an input field for the visitor, and the buttons OK/Cancel.
            let result = prompt("Your name?", ["Someone"]);

            let age = prompt('How old are you?', 100);
            alert(`You are ${age} years old!`);

            // shows a message and waits for the user to press “OK” or “Cancel”
            let isBoss = confirm("Are you the boss?");
            alert( isBoss );
        </script>
    </body>
</html>
