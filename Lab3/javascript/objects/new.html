<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <script>
            // constructor function that gives us opporunity to create more objects
            function User(name) {
                this.name = name;
                this.isAdmin = false;
            }

            let user = new User("Jack");

            alert(user.name); // Jack
            alert(user.isAdmin); // false
        </script>
    </body>
</html>
