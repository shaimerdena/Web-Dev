<!DOCTYPE html>
<html>
    <head>
        <title>ToDo List</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <header>
            <h2>ToDo List</h2>
        </header>
        <main class="container">
            <h1>ToDo List</h1>
            <div class="input_group">
                <input type="text" id="todo_input" placeholder="New Task">
                <button id="adding_btn">Add</button>
                <button id="completed">Completed</button>
                <button id = "not_completed">Not Completed</button>
                <button id = "show_all"> Show All</button>
            </div>
            
            <ul id="todo_list"></ul>
        </main>
        <script src="script.js"></script> 
    </body>
</html>
